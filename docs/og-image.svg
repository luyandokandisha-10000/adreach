<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143b31"/>
      <stop offset="100%" stop-color="#236b58"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9b761"/>
      <stop offset="100%" stop-color="#f5d485"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle circles/waves decoration -->
  <circle cx="1100" cy="100" r="320" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="100" cy="550" r="280" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="950" cy="520" r="180" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="80" height="80" rx="24" fill="#e9b761"/>
    <!-- Megaphone icon inside mark -->
    <path d="M22 30 h18 l16 -10 v40 l-16 -10 H22 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 Z" fill="#143b31"/>
    <path d="M30 46 l3 10" stroke="#143b31" stroke-width="4" stroke-linecap="round"/>
    <path d="M62 30 c3 3 5 7 5 10 s-2 7 -5 10" stroke="#143b31" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Brand text -->
    <text x="105" y="56" fill="#fbfaf5" font-family="DM Sans, Inter, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">adreach<tspan fill="#e9b761">.</tspan></text>
    <rect x="330" y="24" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.15"/>
    <text x="395" y="47" fill="#f5d485" font-family="DM Sans, Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">ZAMBIA</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" fill="#ffffff" font-family="DM Sans, Inter, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Broadcast Your Business Across
  </text>
  <text x="100" y="340" fill="url(#gold)" font-family="DM Sans, Inter, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Verified Zambian Social Networks
  </text>

  <!-- Tagline -->
  <text x="100" y="415" fill="#cadfd9" font-family="DM Sans, Inter, sans-serif" font-size="24" font-weight="400">
    Facebook Groups · WhatsApp Communities · LinkedIn · TikTok · Instagram
  </text>
  <text x="100" y="455" fill="#cadfd9" font-family="DM Sans, Inter, sans-serif" font-size="24" font-weight="400">
    Direct reach to buyers in Lusaka, Copperbelt, and nationwide.
  </text>

  <!-- Badges footer -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="220" height="46" rx="23" fill="#e9b761"/>
    <text x="110" y="29" fill="#143b31" font-family="DM Sans, Inter, sans-serif" font-size="16" font-weight="800" text-anchor="middle">FIRST 10 ADS FREE</text>

    <rect x="240" y="0" width="240" height="46" rx="23" fill="#ffffff" fill-opacity="0.12"/>
    <text x="360" y="29" fill="#fbfaf5" font-family="DM Sans, Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">MTN MoMo &amp; Airtel Money</text>

    <rect x="500" y="0" width="230" height="46" rx="23" fill="#ffffff" fill-opacity="0.12"/>
    <text x="615" y="29" fill="#fbfaf5" font-family="DM Sans, Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Under 2-Hr Verification</text>
  </g>
</svg>
