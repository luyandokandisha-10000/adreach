kind = "web"
previewPath = "/"
title = "AdReach"
description = "A subscription-based classifieds and ad-distribution platform where businesses submit promotions once, track approvals and tiers, and prepare approved ads for social-channel distribution."
version = "1.0.0"
id = "artifacts/ad-reach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25725

[services.development]
run = "pnpm --filter @workspace/ad-reach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ad-reach", "run", "build" ]
serve = "static"
publicDir = "artifacts/ad-reach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25725"
BASE_PATH = "/"
