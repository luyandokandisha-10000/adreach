name: Deploy AdReach to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application for GitHub Pages
        env:
          BASE_PATH: /adreach/
          GITHUB_ACTIONS: 'true'
        run: pnpm --filter @workspace/ad-reach run build:gh-pages

      - name: Create 404.html for SPA Client-Side Routing
        run: cp artifacts/ad-reach/dist/public/index.html artifacts/ad-reach/dist/public/404.html

      # 1. Direct GitHub Pages Actions Deployment
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/ad-reach/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 2. Branch-based GitHub Pages Deployment (gh-pages branch)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: artifacts/ad-reach/dist/public
          clean: true
