openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for AdReach classifieds, subscriptions, administration, and distribution queue
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ads
    description: Advertisement submission and review
  - name: account
    description: User account and subscription operations
  - name: admin
    description: Administrator-only review and distribution queue
  - name: storage
    description: Image upload and serving
  - name: social
    description: Connected social accounts and post distribution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /plans:
    get:
      operationId: listPlans
      tags: [account]
      summary: List subscription plans
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get the signed-in user's dashboard
      responses:
        "200":
          description: Account dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDashboard"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads:
    post:
      operationId: createAd
      tags: [ads]
      summary: Submit an advertisement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "201":
          description: Advertisement submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: Free submissions are used and an active subscription is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid ad data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /subscriptions/manual-payment:
    post:
      operationId: requestManualPayment
      tags: [account]
      summary: Request payment verification through WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanPurchaseInput"
      responses:
        "201":
          description: Pending payment request and WhatsApp instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPaymentRequest"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A subscription is already active or a payment is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /subscriptions/cancel:
    post:
      operationId: cancelSubscription
      tags: [account]
      summary: Cancel the current subscription
      responses:
        "200":
          description: Subscription cancellation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get administrator queue summary
      responses:
        "200":
          description: Summary counts and latest queue events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/ads:
    get:
      operationId: listAdminAds
      tags: [admin]
      summary: List ads for administrator review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, active, rejected, all]
      responses:
        "200":
          description: Ads with owner and tier information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAd"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/ads/{id}/review:
    patch:
      operationId: reviewAd
      tags: [admin]
      summary: Approve or reject a submitted ad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdReviewInput"
      responses:
        "200":
          description: Updated advertisement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/webhook-logs:
    get:
      operationId: listWebhookLogs
      tags: [admin]
      summary: List ad submission and distribution events
      responses:
        "200":
          description: Event queue and webhook log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionEvent"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/subscriptions/pending-payments:
    get:
      operationId: listPendingPayments
      tags: [admin]
      summary: List subscription payments awaiting confirmation
      responses:
        "200":
          description: Pending WhatsApp payment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPaymentRequest"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/subscriptions/{id}/payment-review:
    patch:
      operationId: reviewPayment
      tags: [admin]
      summary: Confirm or reject a WhatsApp payment request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReviewInput"
      responses:
        "200":
          description: Updated subscription payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Pending payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Payment request already reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /social/channels:
    get:
      operationId: listSocialChannels
      tags: [social]
      summary: List AdReach social destinations and publishing limits
      responses:
        "200":
          description: Fixed channels and their supported publishing modes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialChannel"
  /social/accounts:
    get:
      operationId: listSocialAccounts
      tags: [social]
      summary: List social profiles connected by the signed-in user
      responses:
        "200":
          description: Connected social accounts and OAuth setup availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccountList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /social/accounts/{id}:
    delete:
      operationId: disconnectSocialAccount
      tags: [social]
      summary: Disconnect one of the signed-in user's social accounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Connected account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /social/accounts/{id}/brand:
    patch:
      operationId: setBrandSocialAccount
      tags: [social]
      summary: Mark an admin-connected account as an AdReach channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/SocialBrandUpdateInput"
      responses:
        "200":
          description: Channel designation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccount"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Connected account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /social/oauth/{provider}/start:
    get:
      operationId: startSocialOAuth
      tags: [social]
      summary: Start OAuth to connect a social profile
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SocialProvider"
      responses:
        "302":
          description: Redirect to the selected social provider
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Provider app credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /social/oauth/{provider}/callback:
    get:
      operationId: finishSocialOAuth
      tags: [social]
      summary: Finish OAuth after provider consent
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SocialProvider"
      responses:
        "302":
          description: Redirect back to the connected accounts page
        "400":
          description: Invalid or expired authorization state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve an uploaded ad image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Plan:
      type: object
      required: [id, name, amountK, currency, interval, description]
      properties:
        id:
          type: string
          enum: [weekly, monthly]
        name:
          type: string
        amountK:
          type: integer
        currency:
          type: string
          enum: [ZMK]
        interval:
          type: string
          enum: [week, month]
        description:
          type: string
    Subscription:
      type: object
      required: [id, planId, status, amountK, currency, paymentStatus, startedAt, expiresAt]
      properties:
        id:
          type: string
        planId:
          type: string
          enum: [weekly, monthly]
        status:
          type: string
          enum: [payment_pending, active, canceled, expired, rejected]
        amountK:
          type: integer
        currency:
          type: string
          enum: [ZMK]
        paymentStatus:
          type: string
          enum: [pending, confirmed, rejected, mock_paid]
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        canceledAt:
          type: [string, "null"]
          format: date-time
        paymentReviewedAt:
          type: [string, "null"]
          format: date-time
        paymentReviewNote:
          type: [string, "null"]
    Ad:
      type: object
      required: [id, userId, userName, email, title, description, link, imagePath, status, planId, createdAt, approvedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        title:
          type: string
        description:
          type: string
        link:
          type: string
          format: uri
        imagePath:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, active, rejected]
        planId:
          type: string
          enum: [free, weekly, monthly]
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: [string, "null"]
          format: date-time
        adminNote:
          type: [string, "null"]
    AdminAd:
      allOf:
        - $ref: "#/components/schemas/Ad"
        - type: object
          required: [userTier]
          properties:
            userTier:
              type: string
              enum: [free, weekly, monthly]
    AdInput:
      type: object
      required: [userName, title, description, link]
      properties:
        userName:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 3000
        link:
          type: string
          format: uri
        imagePath:
          type: [string, "null"]
        shareToAdReachChannels:
          type: boolean
          default: true
        socialAccountIds:
          type: array
          uniqueItems: true
          items:
            type: string
    PlanPurchaseInput:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
          enum: [weekly, monthly]
    AdReviewInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 1000
    AccountDashboard:
      type: object
      required: [user, ads, plans, freeAdsUsed, freeAdsLimit, canSubmit, events]
      properties:
        user:
          type: object
          required: [userId, name, email, role]
          properties:
            userId:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              enum: [customer, admin]
        ads:
          type: array
          items:
            $ref: "#/components/schemas/Ad"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        freeAdsUsed:
          type: integer
        freeAdsLimit:
          type: integer
        canSubmit:
          type: boolean
        events:
          type: array
          items:
            $ref: "#/components/schemas/DistributionEvent"
    DistributionEvent:
      type: object
      required: [id, adId, eventType, status, payload, attempts, createdAt]
      properties:
        id:
          type: string
        adId:
          type: string
        eventType:
          type: string
          enum: [ad.submitted, ad.approved, ad.channel_post]
        status:
          type: string
          enum: [queued, ready, processing, manual_required, needs_connection, delivered, failed]
        payload:
          type: object
          additionalProperties: true
        attempts:
          type: integer
        lastError:
          type: [string, "null"]
        deliveredAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    AdminOverview:
      type: object
      required: [pendingAds, activeAds, rejectedAds, queuedEvents, pendingPayments, latestEvents]
      properties:
        pendingAds:
          type: integer
        activeAds:
          type: integer
        rejectedAds:
          type: integer
        queuedEvents:
          type: integer
        pendingPayments:
          type: integer
        latestEvents:
          type: array
          items:
            $ref: "#/components/schemas/DistributionEvent"
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ManualPaymentRequest:
      type: object
      required: [subscription, whatsappUrl, whatsappNumber, instructions]
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
        whatsappUrl:
          type: string
          format: uri
        whatsappNumber:
          type: string
        instructions:
          type: string
    AdminPaymentRequest:
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          required: [userName, email]
          properties:
            userName:
              type: string
            email:
              type: string
              format: email
    PaymentReviewInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 1000
    SocialProvider:
      type: string
      enum: [facebook_page, instagram, linkedin, reddit]
    SocialChannel:
      type: object
      required: [id, provider, label, url, mode, note]
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [facebook, instagram, linkedin, reddit]
        label:
          type: string
        url:
          type: string
          format: uri
        mode:
          type: string
          enum: [automatic, manual, setup_required]
        note:
          type: string
    SocialAccount:
      type: object
      required: [id, provider, displayName, profileUrl, accountType, scopes, isBrandChannel, connectedAt]
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/SocialProvider"
        displayName:
          type: string
        profileUrl:
          type: string
          format: uri
        accountType:
          type: string
        scopes:
          type: array
          items:
            type: string
        isBrandChannel:
          type: boolean
        connectedAt:
          type: string
          format: date-time
    SocialProviderStatus:
      type: object
      required: [provider, configured, message]
      properties:
        provider:
          $ref: "#/components/schemas/SocialProvider"
        configured:
          type: boolean
        message:
          type: string
    SocialAccountList:
      type: object
      required: [accounts, providers]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/SocialAccount"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SocialProviderStatus"
    SocialBrandUpdateInput:
      type: object
      required: [isBrandChannel]
      properties:
        isBrandChannel:
          type: boolean
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

